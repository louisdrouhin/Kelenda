# ============================================================
# Routage Traefik (CRDs IngressRoute/Middleware — Traefik est déjà
# l'ingress controller par défaut de K3s, rien à déployer en plus).
# ============================================================

# --- Middlewares ---------------------------------------------

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: kelenda
spec:
  forwardAuth:
    address: "http://auth-service.kelenda.svc.cluster.local/auth/verify"
    authResponseHeaders:
      - X-User-Id
      - X-Workspace-Id
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: kelenda
spec:
  rateLimit:
    average: 100
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth-strict
  namespace: kelenda
spec:
  # Limite basse spécifique à /auth/login et /auth/register — protection brute-force.
  rateLimit:
    average: 5
    burst: 10
---
# Utilisé uniquement par la route de test forward-auth ci-dessous, pour
# renvoyer le préfixe vers /health côté auth-service une fois le forward-auth
# validé par Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-forward-auth-test-prefix
  namespace: kelenda
spec:
  stripPrefix:
    prefixes:
      - /_forward-auth-test

# --- Routes ----------------------------------------------------
# Note : /auth/register et /auth/login sont volontairement séparés du
# reste de /auth — impossible d'appliquer forward-auth avant d'avoir un
# token. Les routes /auth protégées (me, sessions, link...) sont
# vérifiées par auth-service lui-même, qui a déjà toute la logique JWT
# nécessaire — pas besoin de la dupliquer via un forward-auth vers lui-même.

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-auth-public
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: Path(`/auth/register`) || Path(`/auth/login`) || PathPrefix(`/auth/login/`) || PathPrefix(`/auth/callback/`) || Path(`/auth/refresh`)
      kind: Rule
      middlewares:
        - name: rate-limit-auth-strict
      services:
        - name: auth-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-auth-rest
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/auth`) || PathPrefix(`/workspaces`)
      kind: Rule
      middlewares:
        - name: rate-limit
      services:
        - name: auth-service
          port: 80
---
# Route de test historique pour valider le forward-auth réel avant que
# calendar-service n'existe. Conservée comme route de debug rapide (health-check
# seul, sans dépendance à un vrai service) — voir kelenda-calendar ci-dessous
# pour la vraie route protégée par forward-auth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-forward-auth-test
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/_forward-auth-test`)
      kind: Rule
      middlewares:
        - name: forward-auth
        - name: rate-limit
        - name: strip-forward-auth-test-prefix
      services:
        - name: auth-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-calendar
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/calendar`)
      kind: Rule
      middlewares:
        - name: forward-auth
        - name: rate-limit
      services:
        - name: calendar-service
          port: 80
---
# Le serveur CalDAV (RFC 4791) parle HTTP Basic Auth, pas Bearer JWT — les
# clients (app Calendrier iPhone/macOS) n'implémentent pas OAuth pour ce
# protocole. forward-auth attend un Bearer et casserait ces requêtes ; c'est
# calendar-service lui-même qui vérifie les credentials Basic Auth (voir
# src/caldav/require-basic-auth.ts). Priorité plus haute que kelenda-calendar
# pour que /calendar/caldav/* soit évalué en premier malgré le préfixe partagé.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-calendar-caldav
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/calendar/caldav`) || Path(`/.well-known/caldav`)
      kind: Rule
      priority: 100
      middlewares:
        - name: rate-limit
      services:
        - name: calendar-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kelenda-finance
  namespace: kelenda
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/finance`)
      kind: Rule
      middlewares:
        - name: forward-auth
        - name: rate-limit
      services:
        - name: finance-service
          port: 80
