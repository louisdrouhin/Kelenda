apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-service
  namespace: kelenda
spec:
  replicas: 1
  selector:
    matchLabels: { app: calendar-service }
  template:
    metadata:
      labels: { app: calendar-service }
    spec:
      initContainers:
        - name: migrate
          image: kelenda-calendar-service:local
          imagePullPolicy: IfNotPresent
          command: ["npx", "node-pg-migrate", "up", "--migrations-dir", "services/calendar-service/migrations"]
          workingDir: /app
          env:
            # AUTH_DB_PASSWORD-équivalent doit être déclaré AVANT DATABASE_URL pour
            # que $(...) s'interpole (cf. bug documenté dans le suivi d'implémentation).
            - name: CALENDAR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secrets, key: CALENDAR_DB_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql://calendar_service:$(CALENDAR_DB_PASSWORD)@postgres:5432/calendar_db"
      containers:
        - name: calendar-service
          image: kelenda-calendar-service:local
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "services/calendar-service/dist/index.js"]
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: CALENDAR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secrets, key: CALENDAR_DB_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql://calendar_service:$(CALENDAR_DB_PASSWORD)@postgres:5432/calendar_db"
            # Vérification JWT locale en filet de sécurité (défense en profondeur) :
            # le service ne se fie pas uniquement à X-User-Id injecté par Traefik,
            # il revérifie la signature lui-même et en dérive le user_id.
            - name: JWT_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: auth-service-secrets, key: JWT_PUBLIC_KEY } }
            # Paire interne calendar-service → auth-service (résolution d'email pour
            # les credentials CalDAV, voir Kelenda_Suivi_Implementation.md).
            - name: AUTH_SERVICE_INTERNAL_URL
              value: "http://auth-service.kelenda.svc.cluster.local"
            - name: INTERNAL_SECRET_CALENDAR_AUTH
              valueFrom: { secretKeyRef: { name: internal-pair-calendar-auth, key: secret } }
          resources:
            requests: { cpu: 150m, memory: 150Mi }
            limits: { cpu: 400m, memory: 300Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-service
  namespace: kelenda
spec:
  selector: { app: calendar-service }
  ports:
    - port: 80
      targetPort: 3000
